name: Publish to Plugin Marketplace
# A GitHub release tagged v<version> (the version in module.yaml) hands the
# commit to the Prusa Connect marketplace builder. It builds every platform,
# signs with the key in the `release` environment, attests and uploads the
# release with its source. A person at Prusa reviews it before operators can
# install it.
#
# One-time setup (https://plugin-marketplace.prusa3d.com/docs/connect/github-actions):
#   - GitHub environment `release`, limited to tags v*, holding
#     PRUSA_CONNECT_EXTENSION_SIGNING_KEY.
#   - Trusted publisher in the author console: extension
#     com.github.aux.leotrax3d.layerwatch-ai, repository leotrax3d/layerwatch-ai,
#     workflow release.yml, environment release.
on:
  release:
    types: [published]
jobs:
  publish:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: prusa3d/prusa-connect-marketplace-publish/.github/workflows/publish.yml@v1
    with:
      path: .
      bundle-command: make ui-build
      core-ref: v0.1.0-beta.1 # Prusa Connect into .core/, until the SDK is published
    secrets:
      PRUSA_CONNECT_EXTENSION_SIGNING_KEY: ${{ secrets.PRUSA_CONNECT_EXTENSION_SIGNING_KEY }}
