<!doctype html>
<html><head><meta charset="utf-8">
<style>
  :root{
    --bg: oklch(98.2% 0.003 277.7); --fg: oklch(24.1% 0.0099 277.7);
    --muted: oklch(95.6% 0.0045 277.7); --muted-fg: oklch(50.3% 0.0139 277.7);
    --border: oklch(91% 0.0077 277.7); --primary: oklch(66.7% 0.2194 37.8);
    --destructive: oklch(55.7% 0.1933 23.03); --red9: oklch(62.6% 0.1933 23.03);
    --success: #00a072; --success-bg:#e4f7ed; --success-fg:#008257;
  }
  *{box-sizing:border-box;margin:0}
  body{width:1280px;height:640px;background:var(--bg);color:var(--fg);
    font-family:Inter,system-ui,sans-serif;display:flex;align-items:center;
    justify-content:center;padding:0;overflow:hidden}
  .copy{flex:1}
  .mark{display:flex;align-items:center;gap:12px;color:var(--muted-fg);font-size:20px;font-weight:500;margin-bottom:28px}
  .mark i{width:12px;height:12px;border-radius:3px;background:var(--primary);display:block}
  h1{font-size:68px;font-weight:600;letter-spacing:-0.025em;line-height:1}
  p.lead{margin-top:22px;font-size:27px;line-height:1.35;color:var(--muted-fg);max-width:470px}
  ul{list-style:none;padding:0;margin-top:34px;display:flex;flex-direction:column;gap:12px;font-size:20px}
  li{display:flex;gap:12px;align-items:center}
  li b{width:6px;height:6px;border-radius:50%;background:var(--primary);display:block}
  .card{width:560px;background:#fff;border:1px solid var(--border);border-radius:12px;
    box-shadow:0 1px 2px rgb(0 0 0 / .04),0 12px 32px -12px rgb(0 0 0 / .12)}
  .head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 14px}
  .head h2{font-size:20px;font-weight:600}
  .badge{font-size:14px;font-weight:600;padding:4px 10px;border-radius:999px;color:#fff;background:var(--destructive)}
  .body{padding:0 20px 20px;display:flex;flex-direction:column;gap:14px}
  .pic{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:960/736}
  .pic img{display:block;width:100%;height:100%}
  .pic svg{position:absolute;inset:0}
  .pic svg{display:block;width:100%;height:100%}
  .count{position:absolute;top:10px;left:10px;background:rgb(255 255 255 / .92);color:var(--destructive);
    font-size:13px;font-weight:600;padding:2px 7px;border-radius:4px}
  .bar{height:8px;border-radius:99px;background:var(--muted);overflow:hidden}
  .bar div{height:100%;width:86%;background:var(--destructive);border-radius:99px}
  dl{display:grid;grid-template-columns:1fr 1fr;row-gap:6px;font-size:15px}
  dt{color:var(--muted-fg)} dd{font-variant-numeric:tabular-nums}
  .note{font-size:15px;font-weight:500}
.stack{display:flex;flex-direction:column;align-items:center;gap:16px}
  .title{display:flex;align-items:center;gap:14px;font-size:44px;font-weight:600;letter-spacing:-0.02em}
  .title i{width:16px;height:16px;border-radius:4px;background:var(--primary);display:block}
</style></head><body>
  <div class="stack">
  <div class="title"><i></i>LayerWatch AI</div>
  <div class="card">
    <div class="head"><h2>MK4S · Workshop</h2><span class="badge">Failed</span></div>
    <div class="body">
      <div class="pic">
        <img src="thumbnail-photo.webp" alt="">
        <svg viewBox="0 0 960 736" preserveAspectRatio="none">
          <rect x="70" y="105" width="410" height="390" rx="4" fill="oklch(55.7% 0.1933 23.03 / .10)" stroke="oklch(62.6% 0.1933 23.03)" stroke-width="6"/>
          <rect x="4" y="505" width="420" height="227" rx="4" fill="oklch(55.7% 0.1933 23.03 / .10)" stroke="oklch(62.6% 0.1933 23.03)" stroke-width="6"/>
        </svg>
        
      </div>
      
      <p class="note">Print paused · 2 regions flagged</p>
    </div>
  </div>
  </div>
</body></html>
